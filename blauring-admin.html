<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blauring Baden — Stammdaten</title>
<style>
  :root{
    --blue-dark:#012e5b;--blue:#01579b;--blue-light:#2b8fd6;
    --ink:#12293f;--muted:#65788c;--card:#fff;--line:#dce6ef;--bg:#eef4f9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  header{background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;padding:18px 26px;
         display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(0,0,0,.16);
         border-bottom:4px solid var(--blue-light)}
  header h1{font-size:1.25rem;display:flex;align-items:center;gap:11px;font-weight:800}
  header h1 .ring{width:26px;height:26px;border-radius:50%;border:4px solid #fff;display:inline-block}
  header .who{font-size:.9rem;opacity:.94;text-align:right}
  header .who b{display:block;font-size:1rem}
  header .nav{display:flex;gap:8px;margin-top:6px;justify-content:flex-end}
  .navbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);color:#fff;
          padding:7px 13px;border-radius:8px;cursor:pointer;font-size:.82rem;text-decoration:none;display:inline-block}
  .navbtn:hover{background:rgba(255,255,255,.28)}
  main{max-width:1180px;margin:0 auto;padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .card{background:var(--card);border-radius:14px;padding:24px;box-shadow:0 3px 16px rgba(20,50,70,.07)}
  .card h2{font-size:1.1rem;margin-bottom:16px;color:var(--blue)}
  label{display:block;font-size:.82rem;font-weight:600;margin:13px 0 5px}
  input,select{width:100%;padding:10px 13px;border:1.5px solid #d5e0ea;border-radius:9px;font-size:.95rem;background:#fafcfe;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--blue-light);box-shadow:0 0 0 3px rgba(43,143,214,.14)}
  .btn{padding:11px 20px;border:none;border-radius:9px;cursor:pointer;font-weight:700;font-size:.93rem;
       background:linear-gradient(135deg,var(--blue-light),var(--blue));color:#fff;transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(1,87,155,.3)}
  .btn.small{padding:6px 12px;font-size:.8rem}
  .btn.danger{background:#fdecea;color:#c0392b;border:1px solid #f5c6c0;box-shadow:none}
  .btn.danger:hover{background:#f9dcd8;box-shadow:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:8px}
  th,td{padding:10px 11px;text-align:left;border-bottom:1px solid var(--line)}
  th{font-size:.74rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  tbody tr:hover{background:#f4f9fd}
  .empty{padding:20px;text-align:center;color:var(--muted);font-size:.9rem}
  .msg{margin-top:14px;padding:11px 13px;border-radius:8px;font-size:.88rem;display:none}
  .msg.err{display:block;background:#fdecea;color:#c0392b;border:1px solid #f5c6c0}
  .msg.ok{display:block;background:#e8f1fa;color:var(--blue);border:1px solid #bcd9ef}
  .pill{font-size:.72rem;background:#e4edf5;color:var(--blue);padding:3px 9px;border-radius:20px;font-weight:700}
  @media(max-width:820px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1><span class="ring"></span>Blauring Baden — Stammdaten</h1>
  <div class="who">
    <b id="uName">…</b><span id="uRole"></span>
    <div class="nav">
      <a class="navbtn" href="/kassier">📑 Belege</a>
      <button class="navbtn" id="logout">Abmelden</button>
    </div>
  </div>
</header>

<main>
  <!-- LEITER -->
  <div class="card">
    <h2>👥 Leiter / Leitungspersonen</h2>
    <form id="leaderForm">
      <div class="grid2">
        <div><label for="lFirst">Vorname</label><input id="lFirst" required></div>
        <div><label for="lLast">Nachname</label><input id="lLast" required></div>
      </div>
      <div class="grid2">
        <div><label for="lUser">Benutzername</label><input id="lUser" required></div>
        <div><label for="lPass">Passwort</label><input id="lPass" type="text" value="demo123"></div>
      </div>
      <div class="grid2">
        <div><label for="lEmail">E-Mail</label><input id="lEmail" type="email"></div>
        <div><label for="lRole">Rolle</label>
          <select id="lRole">
            <option value="leiter">Leiter</option>
            <option value="kassierer">Kassier</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>
      <div class="msg" id="leaderMsg"></div>
      <br><button class="btn" type="submit">➕ Leiter hinzufügen</button>
    </form>

    <div id="leaderList" style="margin-top:18px"><div class="empty">Lade…</div></div>
  </div>

  <!-- ANLÄSSE -->
  <div class="card">
    <h2>🏷️ Anlässe (Dropdown)</h2>
    <form id="reasonForm">
      <div class="grid2">
        <div><label for="rName">Neuer Anlass</label><input id="rName" placeholder="z.B. Lager, Gruppenstunde" required></div>
        <div><label for="rBudget">Budget (CHF)</label><input id="rBudget" type="number" step="0.05" min="0" value="0"></div>
      </div>
      <div class="msg" id="reasonMsg"></div>
      <br><button class="btn" type="submit">➕ Anlass hinzufügen</button>
    </form>

    <div id="reasonList" style="margin-top:18px"><div class="empty">Lade…</div></div>
  </div>
</main>

<script>
const user = JSON.parse(sessionStorage.getItem('blauring_user') || 'null');
if (!user || (user.role !== 'kassierer' && user.role !== 'admin')) {
  window.location.href = '/login';
}
if (user){ document.getElementById('uName').textContent = user.name;
           document.getElementById('uRole').textContent = user.role; }

document.getElementById('logout').addEventListener('click', async () => {
  try { await fetch('/api/logout', {method:'POST'}); } catch(e){}
  sessionStorage.removeItem('blauring_user');
  window.location.href = '/login';
});

function flash(el, cls, text){
  el.className = 'msg ' + cls; el.textContent = text;
  if (cls === 'ok') setTimeout(()=>{ el.className='msg'; }, 4000);
}

async function loadLeaders(){
  const res = await fetch('/api/leaders');
  const rows = await res.json();
  const w = document.getElementById('leaderList');
  if (!rows.length){ w.innerHTML = '<div class="empty">Keine Leiter erfasst.</div>'; return; }
  w.innerHTML = `<table><thead><tr><th>Name</th><th>Benutzer</th><th>Rolle</th><th></th></tr></thead><tbody>
    ${rows.map(l=>`<tr>
      <td><b>${l.name}</b><br><span style="color:#65788c;font-size:.8rem">${l.email||''}</span></td>
      <td>${l.username}</td>
      <td><span class="pill">${l.role}</span></td>
      <td><button class="btn small danger" data-del="${l.id}">löschen</button></td>
    </tr>`).join('')}
  </tbody></table>`;
  w.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => delLeader(b.dataset.del)));
}

async function delLeader(id){
  if (!confirm('Diesen Leiter wirklich löschen?')) return;
  const res = await fetch('/api/leaders/' + id, {method:'DELETE'});
  const data = await res.json();
  if (res.ok){ flash(document.getElementById('leaderMsg'), 'ok', data.message); loadLeaders(); }
  else { flash(document.getElementById('leaderMsg'), 'err', data.error || 'Fehler'); }
}

async function loadReasons(){
  const res = await fetch('/api/reasons');
  const rows = await res.json();
  const w = document.getElementById('reasonList');
  if (!rows.length){ w.innerHTML = '<div class="empty">Keine Anlässe erfasst.</div>'; return; }
  w.innerHTML = `<table><thead><tr><th>Anlass</th><th>Budget (CHF)</th><th></th></tr></thead><tbody>
    ${rows.map(r=>`<tr>
      <td>${r.reason}</td>
      <td><input class="budgetInput" data-reason="${encodeURIComponent(r.reason)}" type="number" step="0.05" min="0" value="${Number(r.budget||0).toFixed(2)}" style="width:110px;padding:6px 9px"></td>
      <td style="white-space:nowrap">
        <button class="btn small" data-save="${encodeURIComponent(r.reason)}">speichern</button>
        <button class="btn small danger" data-del="${encodeURIComponent(r.reason)}">löschen</button>
      </td></tr>`).join('')}
  </tbody></table>`;
  w.querySelectorAll('[data-save]').forEach(b => b.addEventListener('click', () => saveBudget(b.dataset.save)));
  w.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => delReason(b.dataset.del)));
}

async function saveBudget(enc){
  const name = decodeURIComponent(enc);
  const input = document.querySelector('.budgetInput[data-reason="'+CSS.escape(enc)+'"]')
             || [...document.querySelectorAll('.budgetInput')].find(i=>decodeURIComponent(i.dataset.reason)===name);
  const budget = input ? Number(input.value || 0) : 0;
  const res = await fetch('/api/reasons/' + enc, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({budget: budget})
  });
  let data={}; try{ data = await res.json(); }catch(e){}
  if (res.ok){ flash(document.getElementById('reasonMsg'),'ok', data.message || 'Budget gespeichert.'); loadReasons(); }
  else { flash(document.getElementById('reasonMsg'),'err', data.error || 'Fehler'); }
}

async function delReason(enc){
  const name = decodeURIComponent(enc);
  if (!confirm('Anlass "' + name + '" wirklich löschen?')) return;
  const res = await fetch('/api/reasons/' + enc, {method:'DELETE'});
  const data = await res.json();
  if (res.ok){ flash(document.getElementById('reasonMsg'), 'ok', data.message); loadReasons(); }
  else { flash(document.getElementById('reasonMsg'), 'err', data.error || 'Fehler'); }
}

document.getElementById('leaderForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('leaderMsg');
  const payload = {
    first_name: document.getElementById('lFirst').value.trim(),
    last_name: document.getElementById('lLast').value.trim(),
    username: document.getElementById('lUser').value.trim(),
    password: document.getElementById('lPass').value,
    email: document.getElementById('lEmail').value.trim(),
    role: document.getElementById('lRole').value
  };
  const res = await fetch('/api/leaders', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  const data = await res.json();
  if (res.ok){ flash(msg,'ok',data.message); e.target.reset(); document.getElementById('lPass').value='demo123'; loadLeaders(); }
  else { flash(msg,'err',data.error || 'Fehler'); }
});

document.getElementById('reasonForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('reasonMsg');
  const value = document.getElementById('rName').value.trim();
  const res = await fetch('/api/reasons', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({reason:value, budget:Number(document.getElementById('rBudget').value||0)})});
  const data = await res.json();
  if (res.ok){ flash(msg,'ok',data.message); e.target.reset(); loadReasons(); }
  else { flash(msg,'err',data.error || 'Fehler'); }
});

loadLeaders();
loadReasons();
</script>
</body>
</html>
