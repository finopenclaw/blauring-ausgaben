<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName blauring.local
    DocumentRoot /home/erch/.openclaw/workspace

    # Enable Apache2 mod_rewrite for better URL handling
    RewriteEngine On
    RewriteBase /
    RewriteRule ^$ /blauring-verein.html [L]
    
    # Static files, CSS, JS
    <Directory "/home/erch/.openclaw/workspace">
        Options -MultiViews
        AllowOverride All
        Require all granted
    </Directory>
    
    # Log files
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>