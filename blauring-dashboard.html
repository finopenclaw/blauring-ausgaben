<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blauring Baden — Meine Ausgaben</title>
<style>
  :root{
    --blue-dark:#001f3f;--blue:#003366;--blue-light:#1f4e79;
    --ink:#12293f;--muted:#5c6b7a;--card:#fffdf7;--line:#e6ddc9;--bg:#f7f1e3;
    --open:#b4770a;--paid:#0b6b43;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  header{background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;padding:18px 26px;
         display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(0,0,0,.16);
         border-bottom:4px solid var(--blue-light)}
  header h1{font-size:1.25rem;display:flex;align-items:center;gap:11px;font-weight:800}
  header h1 .ring{width:26px;height:26px;border-radius:50%;border:4px solid #fff;display:inline-block}
  header .who{font-size:.9rem;opacity:.94;text-align:right}
  header .who b{display:block;font-size:1rem}
  .logout{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);color:#fff;
          padding:7px 13px;border-radius:8px;cursor:pointer;font-size:.82rem;margin-top:6px}
  main{max-width:1180px;margin:0 auto;padding:26px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
  .stat{background:var(--card);border-radius:12px;padding:18px 20px;border-left:5px solid var(--blue);
        box-shadow:0 3px 14px rgba(20,50,70,.07)}
  .stat .v{font-size:1.9rem;font-weight:800;color:var(--blue-dark)}
  .stat .l{font-size:.8rem;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
  .card{background:var(--card);border-radius:14px;padding:24px;box-shadow:0 3px 16px rgba(20,50,70,.07);margin-bottom:24px}
  .card h2{font-size:1.1rem;margin-bottom:16px;color:var(--blue)}
  .btn{display:inline-block;padding:11px 20px;border:none;border-radius:9px;cursor:pointer;
       font-weight:700;font-size:.93rem;background:linear-gradient(135deg,var(--blue-light),var(--blue));color:#fff;
       transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(1,87,155,.3)}
  .btn.gray{background:#e4edf5;color:var(--ink);box-shadow:none}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line)}
  th{font-size:.76rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  tbody tr:hover{background:#f4f9fd}
  .badge{padding:4px 11px;border-radius:20px;font-size:.76rem;font-weight:700;white-space:nowrap}
  .badge.open{background:#fdf2dc;color:var(--open);border:1px solid #f2d9a8}
  .badge.paid{background:#e6f5ed;color:var(--paid);border:1px solid #b6e0c9}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:.92rem}
  label{display:block;font-size:.82rem;font-weight:600;margin:13px 0 5px}
  input,select,textarea{width:100%;padding:10px 13px;border:1.5px solid #d5e0ea;border-radius:9px;
        font-size:.95rem;background:#fafcfe;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue-light);box-shadow:0 0 0 3px rgba(43,143,214,.14)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  .msg{margin-top:14px;padding:11px 13px;border-radius:8px;font-size:.88rem;display:none}
  .msg.err{display:block;background:#fdecea;color:#c0392b;border:1px solid #f5c6c0}
  .msg.ok{display:block;background:#e8f1fa;color:var(--blue);border:1px solid #bcd9ef}
  .btn.gray{background:#e4edf5;color:var(--ink);box-shadow:none}
  .btn.gray:hover{transform:none;box-shadow:none;background:#d7e4ef}
  .btn.small{padding:7px 13px;font-size:.82rem}
  @media(max-width:700px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1><span class="ring"></span>Blauring Baden — Meine Ausgaben</h1>
  <div class="who">
    <b id="uName">…</b>
    <span id="uRole"></span><br>
    <button class="logout" id="logout">Abmelden</button>
  </div>
</header>

<main>
  <div class="stats">
    <div class="stat"><div class="v" id="sTotal">0.00 CHF</div><div class="l">Meine Summe</div></div>
    <div class="stat"><div class="v" id="sOpen">0</div><div class="l">Offen</div></div>
    <div class="stat"><div class="v" id="sPaid">0</div><div class="l">Bezahlt</div></div>
    <div class="stat"><div class="v" id="sCount">0</div><div class="l">Einträge</div></div>
  </div>

  <div class="card" id="reasonCard" style="display:none">
    <h2>🏷️ Mein Anlass</h2>
    <div id="reasonInfo"></div>
  </div>

  <div class="card">
    <h2>➕ Neue Ausgabe erfassen</h2>
    <form id="expForm">
      <div class="grid2">
        <div>
          <label for="fDate">Datum</label>
          <input type="date" id="fDate" required>
        </div>
        <div>
          <label for="fId">ID (wird automatisch erzeugt)</label>
          <input type="text" id="fId" placeholder="leer lassen = automatisch">
        </div>
      </div>
      <label for="fDesc">Beschreibung</label>
      <textarea id="fDesc" rows="2" placeholder="Wofür war die Ausgabe?" required></textarea>
      <div class="grid2">
        <div>
          <label for="fReason">Anlass</label>
          <select id="fReason" required><option value="">Bitte wählen…</option></select>
        </div>
        <div>
          <label for="fAmount">Betrag (CHF)</label>
          <input type="number" id="fAmount" step="0.05" min="0" placeholder="0.00" required>
        </div>
      </div>
      <label for="fLeader">Leiter</label>
      <select id="fLeader" required></select>
      <label for="fReceipt">Quittung (Bild, optional)</label>
      <input type="file" id="fReceipt" accept="image/*">
      <button type="button" class="btn gray small" id="camBtn" style="margin-top:8px">📷 Foto aufnehmen</button>
      <input type="file" id="fCamera" accept="image/*" capture="environment" style="display:none">
      <div class="msg" id="formMsg"></div>
      <div style="height:22px"></div>
      <button class="btn" type="submit">📨 Abschicken</button>
    </form>
  </div>

  <div class="card">
    <h2>📋 Meine Ausgaben</h2>
    <div id="listWrap"><div class="empty">Lade…</div></div>
  </div>
</main>

<script>
const user = JSON.parse(sessionStorage.getItem('blauring_user') || 'null');
if (!user) { window.location.href = '/login'; }
if (user) {
  document.getElementById('uName').textContent = user.name;
  document.getElementById('uRole').textContent = user.role === 'leiter' ? 'Leiter' : user.role;
  document.getElementById('fDate').valueAsDate = new Date();
}

document.getElementById('logout').addEventListener('click', async () => {
  try { await fetch('/api/logout', {method:'POST'}); } catch(e){}
  sessionStorage.removeItem('blauring_user');
  window.location.href = '/login';
});

let LEADERS = [];
let BUDGETS = {};
let MY_REASON = null;

async function loadMeta(){
  const [r1, r2] = await Promise.all([fetch('/api/reasons'), fetch('/api/leaders')]);
  const reasons = await r1.json();
  LEADERS = await r2.json();
  BUDGETS = {};
  reasons.forEach(x => {
    const name = (typeof x === 'string') ? x : x.reason;
    BUDGETS[name] = (typeof x === 'string') ? 0 : Number(x.budget || 0);
  });
  const sel = document.getElementById('fReason');
  sel.innerHTML = '<option value="">Bitte wählen…</option>';
  reasons.forEach(x => {
    const name = (typeof x === 'string') ? x : x.reason;
    sel.insertAdjacentHTML('beforeend', `<option value="${name}">${name}</option>`);
  });
  const lsel = document.getElementById('fLeader');
  lsel.innerHTML = '';
  LEADERS.forEach(l => lsel.insertAdjacentHTML('beforeend',
    `<option value="${l.id}">${l.name}</option>`));
  if (user && user.name) {
    const match = LEADERS.find(l => l.name.toLowerCase() === user.name.toLowerCase());
    if (match){ lsel.value = match.id; MY_REASON = match.reason || null; }
  }
  if (MY_REASON) sel.value = MY_REASON;
  renderReasonCard();
}

function renderReasonCard(){
  const card = document.getElementById('reasonCard');
  const w = document.getElementById('reasonInfo');
  if (!MY_REASON){ card.style.display='none'; return; }
  card.style.display='block';
  const spent = ROWS_MINE.reduce((s,e)=>s+Number(e.amount),0);
  const budget = BUDGETS[MY_REASON] || 0;
  const rest = budget - spent;
  const pct = budget > 0 ? Math.round(spent/budget*100) : null;
  let bar = '<span style="font-size:.82rem;color:var(--muted)">kein Budget hinterlegt</span>';
  if (budget > 0){
    const w2 = Math.min(100, pct);
    const col = pct>=100 ? '#c0392b' : (pct>=80 ? '#d68910' : '#0b6b43');
    bar = `<div style="background:#e6ddc9;border-radius:8px;height:16px;min-width:150px;overflow:hidden;margin-top:6px">
             <div style="height:16px;width:${w2}%;background:${col}"></div>
           </div><span style="font-size:.8rem;color:var(--muted)">${pct}% ausgeschöpft</span>`;
  }
  w.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px">
      <div><div style="font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Anlass</div>
           <div style="font-size:1.15rem;font-weight:800;color:var(--blue);margin-top:3px">${MY_REASON}</div></div>
      <div><div style="font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Ausgegeben</div>
           <div style="font-size:1.15rem;font-weight:800;margin-top:3px">${spent.toFixed(2)} CHF</div></div>
      <div><div style="font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Budget</div>
           <div style="font-size:1.15rem;font-weight:800;margin-top:3px">${budget>0?budget.toFixed(2)+' CHF':'—'}</div></div>
      <div><div style="font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Rest</div>
           <div style="font-size:1.15rem;font-weight:800;margin-top:3px;color:${budget>0?(rest<0?'#c0392b':'#0b6b43'):'inherit'}">${budget>0?rest.toFixed(2)+' CHF':'—'}</div></div>
    </div>
    <div style="margin-top:10px">${bar}</div>`;
}

let ROWS_MINE = [];

async function loadExpenses(){
  const res = await fetch('/api/expenses');
  const all = await res.json();
  const mine = user && user.name
    ? all.filter(e => (e.leader_name || '').toLowerCase() === user.name.toLowerCase())
    : all;
  ROWS_MINE = mine;
  renderList(mine);
  renderStats(mine);
  renderReasonCard();
}

function renderStats(rows){
  const total = rows.reduce((s,e)=>s+e.amount,0);
  const paid = rows.filter(e=>e.paid).length;
  document.getElementById('sTotal').textContent = total.toFixed(2)+' CHF';
  document.getElementById('sOpen').textContent = rows.length - paid;
  document.getElementById('sPaid').textContent = paid;
  document.getElementById('sCount').textContent = rows.length;
}

function renderList(rows){
  const w = document.getElementById('listWrap');
  if (!rows.length){ w.innerHTML = '<div class="empty">Noch keine Ausgaben erfasst.</div>'; return; }
  w.innerHTML = `<table>
    <thead><tr><th>ID</th><th>Datum</th><th>Beschreibung</th><th>Anlass</th>
    <th>Betrag</th><th>Status</th><th>Beleg</th></tr></thead><tbody>
    ${rows.map(e=>`<tr>
      <td><b>${e.expense_id||''}</b></td>
      <td>${e.date||''}</td>
      <td>${e.description||''}</td>
      <td>${e.reason||''}</td>
      <td>${Number(e.amount).toFixed(2)} CHF</td>
      <td><span class="badge ${e.paid?'paid':'open'}">${e.paid?'Bezahlt':'Offen'}</span></td>
      <td>${e.receipt ? '<button class="btn gray small" data-view="'+e.receipt+'">📎 Beleg</button>' : '—'}</td>
    </tr>`).join('')}
    </tbody></table>`;

  w.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => window.open(b.dataset.view, '_blank')));
}

document.getElementById('camBtn').addEventListener('click', () => document.getElementById('fCamera').click());
document.getElementById('fCamera').addEventListener('change', (ev) => {
  const f = ev.target.files[0];
  if (!f) return;
  // Datei in das normale Quittungs-Feld übernehmen
  const dt = new DataTransfer();
  dt.items.add(new File([f], f.name, {type: f.type}));
  document.getElementById('fReceipt').files = dt.files;
  const msg0 = document.getElementById('formMsg');
  msg0.className = 'msg ok'; msg0.textContent = 'Foto aufgenommen: ' + f.name;
});

document.getElementById('expForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const msg = document.getElementById('formMsg');
  msg.className = 'msg';
  const payload = {
    date: document.getElementById('fDate').value,
    expense_id: document.getElementById('fId').value.trim() || null,
    description: document.getElementById('fDesc').value.trim(),
    reason: document.getElementById('fReason').value,
    amount: parseFloat(document.getElementById('fAmount').value),
    leader_id: parseInt(document.getElementById('fLeader').value, 10)
  };
  try {
    // Buchungsnummer vorab vom Server holen (für Nummer + Dateiname)
    let bookingNo = null;
    try {
      const bs = await fetch('/api/settings/booking');
      if (bs.ok) bookingNo = (await bs.json()).next_expense_id;
    } catch(e){}

    const file = document.getElementById('fReceipt').files[0];
    if (file) {
      const fd = new FormData();
      fd.append('file', file);
      if (bookingNo) fd.append('booking_no', bookingNo);
      const up = await fetch('/api/upload', {method:'POST', body: fd});
      const upData = await up.json();
      if (up.ok) payload.receipt = upData.path;
    }
    const res = await fetch('/api/expenses', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Speichern fehlgeschlagen');
    msg.className='msg ok'; msg.textContent = 'Ausgabe gespeichert ('+ (data.expense_id||'') +').';
    ev.target.reset(); document.getElementById('fDate').valueAsDate = new Date();
    loadExpenses();
  } catch(err){
    msg.className='msg err'; msg.textContent = err.message;
  }
});

(async () => { await loadMeta(); await loadExpenses(); })();
</script>
</body>
</html>
